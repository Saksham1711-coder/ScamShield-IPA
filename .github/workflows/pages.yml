name: Deploy iPhone web app
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Assemble site (adds the QR-scanner library)
        run: |
          mkdir -p _site
          cp -r app/src/main/assets/web/. _site/
          npm install --no-save --no-package-lock jsqr@1.4.0
          cp node_modules/jsqr/dist/jsQR.js _site/jsqr.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
